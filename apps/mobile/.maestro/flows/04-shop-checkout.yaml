appId: com.fit.app
name: 04-shop-checkout
tags:
  - smoke
---
# Smoke: sign in, open the shop, add a product, and place the order.
- runFlow: '../subflows/launch-and-sign-in.yaml'
- openLink: 'fit://shop'
- assertVisible:
    id: 'product-card'
- tapOn:
    id: 'product-card'
    index: 0
# On the product detail, add to cart — the app routes to the cart on success.
- assertVisible:
    id: 'product-add-to-cart'
- tapOn:
    id: 'product-add-to-cart'
- assertVisible:
    id: 'cart-checkout'
- tapOn:
    id: 'cart-checkout'
# The order-confirmation screen the cart replaces to after a placed order.
- assertVisible:
    id: 'order-confirmation'
