appId: com.fit.app
name: 02-book-class
tags:
  - smoke
---
# Smoke: sign in, open the schedule, and book the first class occurrence.
- runFlow: '../subflows/launch-and-sign-in.yaml'
# Jump to the schedule through the app's own deep link so the flow is
# independent of the tab bar's label locale.
- openLink: 'fit://classes'
- assertVisible:
    id: 'class-card'
- tapOn:
    id: 'class-card'
    index: 0
# The class-detail booking CTA (Book / Join waitlist for an occurrence the
# member does not yet hold).
- assertVisible:
    id: 'class-book-button'
- tapOn:
    id: 'class-book-button'
# A successful book / waitlist flips the action area to the "you're booked"
# state, so the Book CTA is replaced — wait for it to disappear.
- extendedWaitUntil:
    notVisible:
      id: 'class-book-button'
    timeout: 15000
