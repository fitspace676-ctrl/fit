<!-- Square, opaque app tile. iOS supplies its own rounded corners. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7896" />
      <stop offset="1" stop-color="#1F4A72" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#7FB3C8" />
      <stop offset="1" stop-color="#7FB3C8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="url(#background)" />
  <rect width="320" height="320" fill="url(#glow)" />
  <g transform="translate(59 65) scale(.2552)" fill="#FFFFFF">
    <polygon points="207,0 791,0 653,185 314,185 237,297 0,299" />
    <polygon points="237,297 717,297 592,455 387,455 187,742 72,538" />
  </g>
</svg>
