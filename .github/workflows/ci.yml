name: CI

# Validate every push to main and every pull request targeting it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token.
permissions:
  contents: read

jobs:
  verify:
    name: Type-check · Lint · Format · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Turbo respects this for log noise; CI=true is set by the runner already.
      TURBO_TELEMETRY_DISABLED: 1
      # Prisma reads DATABASE_URL from the environment. `prisma generate`
      # does not connect, but a value must be present to satisfy the schema's
      # env("DATABASE_URL"). A dummy URL keeps generation hermetic in CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Check .env.example is in sync
        run: pnpm check:env-example

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real datastores for the API's `*.int-spec.ts` suites (tenant isolation,
    # refresh-token rotation/reuse, …) — the unit job mocks the DB; this proves
    # the persisted behaviour end-to-end.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm --filter @fit/api test:integration
