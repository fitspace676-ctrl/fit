name: CI

# Validate every push to main and every pull request targeting it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token.
permissions:
  contents: read

jobs:
  verify:
    name: Type-check · Lint · Format · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Turbo respects this for log noise; CI=true is set by the runner already.
      TURBO_TELEMETRY_DISABLED: 1
      # Prisma reads DATABASE_URL from the environment. `prisma generate`
      # does not connect, but a value must be present to satisfy the schema's
      # env("DATABASE_URL"). A dummy URL keeps generation hermetic in CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Check .env.example is in sync
        run: pnpm check:env-example

      - name: Check controllers declare an auth policy
        run: pnpm check:controller-guards

      - name: Test
        run: pnpm test

      # Enforce the ≥70% coverage floor on the API's business logic (T9.10) —
      # fails the job if billing/notification (or any) service logic lands
      # without specs and drags a metric under the threshold.
      - name: Coverage gate (API ≥70%)
        run: pnpm --filter @fit/api test:cov

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real datastores for the API's `*.int-spec.ts` suites (tenant isolation,
    # refresh-token rotation/reuse, …) — the unit job mocks the DB; this proves
    # the persisted behaviour end-to-end.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm --filter @fit/api test:integration

  e2e:
    name: E2E · admin core flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The whole stack for real: the API and the admin console are booted by
    # Playwright's `webServer` against a live Postgres + Redis, and a browser
    # drives login → member CRUD → schedule → check-in → POS sale → refund.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TELEMETRY_DISABLED: 1
      # Read by the Playwright config for the API webServer and by the migrate /
      # seed steps below. Redis backs auth sessions the login flow depends on.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Shared secret the API signs session tokens with and the admin middleware
      # verifies against — both are handed this value by the Playwright config.
      JWT_SECRET: e2e-ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed the database
        run: pnpm --filter @fit/db db:seed

      - name: Install Playwright browser
        run: pnpm --filter @fit/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @fit/e2e test:e2e

  e2e-web:
    name: E2E · member booking + checkout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The whole stack for real: the API and the member web portal are booted by
    # Playwright's `webServer` against a live Postgres + Redis, and a browser
    # drives register → verify → sign in → book (capacity + waitlist) → shop
    # checkout on the `downtown` tenant subdomain.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TELEMETRY_DISABLED: 1
      # Read by the Playwright config for the API webServer and by the migrate /
      # seed steps below, and by the fixtures' direct Prisma writes. Redis backs
      # the auth sessions the sign-in flow depends on.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Shared secret the API signs session tokens with and the web middleware
      # verifies against — both are handed this value by the Playwright config.
      JWT_SECRET: e2e-ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed the database
        run: pnpm --filter @fit/db db:seed

      - name: Install Playwright browser
        run: pnpm --filter @fit/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @fit/e2e test:e2e:web
